<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Contact | Ayman Islam Personal Training</title>
    <meta name="description" content="Contact Coach Ayman Islam on WhatsApp or through the contact form.">
    <meta property="og:title" content="Contact">
    <meta property="og:description" content="Contact Coach Ayman Islam on WhatsApp or through the contact form.">
    <meta property="og:type" content="website">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23E3141B'/></svg>">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" id="bs">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800;1,900&family=Inter:wght@400;600&family=Cairo:wght@400;600;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/i18n.js"></script>
</head>

<body data-root="../">
    <header class="page-hero">
        <div class="container">
            <h1>Contact</h1>
            <p class="mut fs-5 mb-0">WhatsApp is the fastest way to reach me</p>
        </div>
    </header>
    <section>
        <div class="container">
            <div class="row g-5">
                <div class="col-lg-6">
                    <form id="contactForm" novalidate>
                        <div class="mb-3"><label class="form-label" for="name">Full name *</label><input
                                class="form-control" id="name" name="name">
                            <div class="invalid-msg" data-err="name"></div>
                        </div>
                        <div class="mb-3"><label class="form-label" for="phone">Phone number *</label><input
                                class="form-control" id="phone" name="phone" type="tel">
                            <div class="invalid-msg" data-err="phone"></div>
                        </div>
                        <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control"
                                id="email" name="email" type="email">
                            <div class="invalid-msg" data-err="email"></div>
                        </div>
                        <div class="mb-3"><label class="form-label" for="program">Interested program</label><select
                                class="form-select" id="program" name="program">
                                <option>Weight Loss</option>
                                <option>Muscle Building</option>
                                <option>Strength Training</option>
                                <option>Online Coaching</option>
                                <option>Personal Training</option>
                            </select></div>
                        <div class="mb-3"><label class="form-label" for="message">Message *</label><textarea
                                class="form-control" id="message" name="message" rows="4"></textarea>
                            <div class="invalid-msg" data-err="message"></div>
                        </div>
                        <button class="btn btn-acc" type="submit">Send via WhatsApp</button>
                        <p id="formStatus" class="mt-3" role="status"></p>
                    </form>
                </div>
                <div class="col-lg-6">
                    <div class="card-x">
                        <h2 class="h4">Contact details</h2>
                        <p class="mut"><a class="text-reset" href="tel:+201092404102" dir="ltr">01092404102</a></p><button class="btn btn-acc" data-wa>Chat
                            on WhatsApp</button> <a class="btn btn-out" href="https://www.facebook.com/ayman.islam.941426?locale=ar_AR" target="_blank" rel="noopener"><i class="bi bi-facebook"></i> Facebook</a>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/contact.js"></script>
</body>

</html>
